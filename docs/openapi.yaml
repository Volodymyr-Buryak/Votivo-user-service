openapi: 3.1.0
info:
  title: Votivo User Service API
  version: 0.0.1-SNAPSHOT
  description: |
    API собственного профиля и административного управления пользователями.
    Keycloak является источником идентификационных данных, PostgreSQL хранит локальную проекцию.
    Регистрация, вход и пароли этим API не реализованы. Фотография профиля хранится локально в PostgreSQL.

    Публичные операции /api/v1 требуют JWT access token: проверяются подпись через JWKS, issuer,
    временные ограничения, обязательный exp, audience (по умолчанию user-service)
    и sub в канонической строковой форме UUID. Роли читаются из realm_access.roles:
    только строчные user и admin; собственный профиль и фото доступны user без роли admin.
    Для admin доступна только сводка собственного имени /users/me/header и admin API.
    Для admin API при наличии локального профиля вызывающего дополнительно проверяется
    его локальная роль admin. Заблокированный или локально удалённый вызывающий получает 403.

    Поддерживаются две альтернативы Authorization: Bearer <access-token> для токена
    без cnf и Authorization: DPoP <access-token> вместе с DPoP: <proof-JWT> для
    привязанного токена. Передавать токен с cnf как Bearer запрещено (401).
    DPoP proof создаётся клиентом для каждого запроса; Spring Security проверяет подпись,
    привязку ключа и токена, метод/URI, время и повторное использование proof.
    Локальный ограниченный replay cache: по умолчанию 100000 записей и 1000 запросов на ключ.
    Swagger UI не генерирует такие proof автоматически по этой спецификации.

    PATCH профиля требует оба поля firstName и lastName, несмотря на HTTP-метод PATCH.
    В JSON-телах неизвестные свойства отклоняются. Ответы ошибок используют ProblemDetail;
    внутренние сообщения Keycloak и значения из невалидного запроса не раскрываются.
servers:
  - url: http://localhost:8080
    description: Локальный запуск приложения; порт можно изменить через SERVER_PORT.
  - url: http://localhost:18081
    description: Публикуемый порт User Service в backend Docker Compose.
tags:
  - name: Profile
    description: Собственный профиль; роль user без admin. Сводка имени header доступна также admin.
  - name: Administration
    description: Администрирование; роль admin из access token и проверка локального статуса.
security:
  - bearerAuth: []
  - dpopAuth: []
x-dpop-proof:
  header: DPoP
  requiredWhen: Authorization использует схему DPoP; токен связан с ключом через cnf.jkt.
  generation: Новый подписанный proof JWT для каждого запроса; не статический API key.
paths:
  /internal/v1/users/{id}/access:
    get:
      operationId: checkAccountAccess
      summary: Внутренняя проверка текущего доступа для API Gateway
      description: |
        Вызывается шлюзом после проверки JWT и DPoP на исходном URL. Не кешируется.
        Проверяет, что профиль не удалён и включён; admin=true также требует текущую локальную роль admin.
        Токен пользователя и DPoP proof сюда не пересылаются. Доступ только по общему INTERNAL_AUTH_SECRET.
      security:
        - internalAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: admin
          in: query
          schema:
            type: boolean
            default: false
        - name: issuedAt
          in: query
          required: true
          description: iat из проверенного шлюзом JWT; старые токены остаются отозванными после разблокировки.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Доступ разрешён. Тело отсутствует; Cache-Control no-store.
        '401':
          description: Неверный или отсутствующий секрет шлюза.
        '403':
          description: Пользователь заблокирован или административная роль отозвана.
        '404':
          description: Пользователь не существует или удалён.
        '503':
          description: Проверка недоступна или общий секрет не настроен.
  /api/v1/users/me/photo:
    parameters:
      - $ref: '#/components/parameters/DPoPProof'
    put:
      tags: [Profile]
      operationId: replaceOwnPhoto
      summary: Загрузить или заменить фотографию профиля
      description: |
        Сохраняет одну фотографию пользователя из sub JWT как бинарник в PostgreSQL.
        Полностью заменяет предыдущее фото только после успешной проверки нового.
        Формат определяется по содержимому; MIME-тип и имя файла клиента не используются.
        По умолчанию разрешены JPEG/PNG, до 5MB (5242880 байт) включительно,
        ширина и высота до 4096 пикселей включительно. Настройки app.photo могут
        изменять эти ограничения. Multipart-запрос ограничен 6MB по умолчанию.
        Фото не отправляется в Keycloak и сохраняется при синхронизации профиля.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Непустое изображение JPEG или PNG.
      responses:
        '204':
          description: Фотография сохранена или заменена. Тело ответа отсутствует.
        '400':
          description: Отсутствует file, файл пуст, повреждён или превышает допустимые размеры в пикселях.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Превышен лимит размера файла или всего multipart-запроса.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '415':
          description: Запрос не multipart/form-data либо распознанный формат изображения не разрешён.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Unexpected'
    get:
      tags: [Profile]
      operationId: getOwnPhoto
      summary: Получить свою фотографию профиля
      description: Возвращает исходные сохранённые байты. Доступ требует той же авторизации, что и профиль.
      responses:
        '200':
          description: Бинарник фотографии с фактическим Content-Type.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Фотография отсутствует либо профиль не найден или удалён.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Unexpected'
    delete:
      tags: [Profile]
      operationId: deleteOwnPhoto
      summary: Удалить свою фотографию профиля
      description: |
        Удаляет только фотографию. Повторное удаление при отсутствии фото также возвращает 204.
        Удаление аккаунта, в том числе через синхронизацию, также удаляет его фотографию.
      responses:
        '204':
          description: Фотография отсутствует. Тело ответа отсутствует.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Unexpected'
  /api/v1/users/me/header:
    parameters:
      - $ref: '#/components/parameters/DPoPProof'
    get:
      tags: [Profile]
      operationId: getOwnHeader
      summary: Получить имя и фамилию для шапки
      description: ID берётся из sub JWT. Проверки доступа, блокировки и fallback-синхронизация аналогичны полному профилю.
      responses:
        '200':
          description: Имя и фамилия текущего пользователя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserHeaderResponse'
              example:
                firstName: Ada
                lastName: Lovelace
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Unexpected'
  /api/v1/users/me:
    parameters:
      - $ref: '#/components/parameters/DPoPProof'
    get:
      tags: [Profile]
      operationId: getOwnProfile
      summary: Получить собственный профиль
      description: |
        ID берётся исключительно из sub access token. Если локальной записи ещё нет,
        сервис синхронизирует пользователя из Keycloak. Локально удалённая запись не
        восстанавливается этим запросом. Отсутствующий профиль возвращает 404.
      responses:
        '200':
          $ref: '#/components/responses/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Unexpected'
    patch:
      tags: [Profile]
      operationId: updateOwnProfile
      summary: Обновить имя и фамилию собственного профиля
      description: |
        Оба поля обязательны. ID определяется по sub access token.
        Сервис сначала изменяет данные в Keycloak, затем синхронизирует проекцию.
        Email изменяется только через Keycloak; email в PATCH отклоняется с 400.
        Обновление имени не меняет email, username, emailVerified и не отправляет письма.
        Отсутствующий профиль возвращает 404; известное локальное удаление вызывающего
        отклоняется фильтром безопасности с 403 до выполнения операции.
        Запись в Keycloak и синхронизация не являются одной транзакцией:
        ошибка 503 не гарантирует, что предшествующие действия не выполнены.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              firstName: Ada
              lastName: Lovelace
      responses:
        '200':
          $ref: '#/components/responses/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Unexpected'
    delete:
      tags: [Profile]
      operationId: deleteOwnProfile
      summary: Удалить собственный аккаунт
      description: |
        Аккаунт администратора нельзя удалить через этот API (403): удаление доступно только в Keycloak.
        Запрещено для заблокированного аккаунта (403) и при собственных голосованиях
        со статусом PUBLISHED (409). Черновики, CLOSED и ARCHIVED не мешают удалению.
        Статус аккаунта повторно проверяется в Keycloak перед удалением.
        Poll Service атомарно проверяет голосования и запрещает новые публикации владельца.
        Затем профиль помечается deletedAt, личные данные и фото очищаются в локальной транзакции.
        В Keycloak отправляется enabled=false и отзыв сессий; физического удаления нет.
        Старые email и username заменяются уникальными техническими значениями на deleted.invalid,
        emailVerified сбрасывается. После завершения можно зарегистрироваться со старой почтой:
        это новый аккаунт с новым UUID и обязательным повторным подтверждением email (verifyEmail=true).
        Синхронизация не восстанавливает удалённые профили.
        При недоступности Keycloak после локального удаления возвращается 202:
        сохранённая задача повторяет отключение, отзыв сессий и освобождение адреса после восстановления связи/перезапуска.
        Повторный запрос удалённого пользователя получает 403.
      responses:
        '204':
          description: Профиль удалён, пользователь отключён в Keycloak, сессии отозваны, email и username освобождены.
        '202':
          description: Профиль удалён; отключение Keycloak, отзыв сессий и освобождение адреса сохранены для повторной попытки.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Есть собственные опубликованные незавершённые голосования.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Conflict
                status: 409
                code: account.unfinished-polls
                detail: Close your published polls before deleting your account.
        '503':
          description: До локального удаления не удалось проверить Keycloak или Poll Service; удаление не выполнено.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        default:
          $ref: '#/components/responses/Unexpected'
  /api/v1/admin/users:
    get:
      tags: [Administration]
      operationId: listUserProfiles
      summary: Получить страницу локальных профилей
      description: |
        Читает только локальную проекцию без запроса полного списка в Keycloak.
        Удалённые записи исключены; отключённые включены, если не задан фильтр enabled.
        Сортировка стабильная по id по возрастанию; параметра изменения сортировки нет.
        Поиск по вхождению в email, firstName или lastName нечувствителен к регистру.
        Краевые пробелы search удаляются, пустой поиск не фильтрует; символы %, _ и !
        трактуются как буквальные символы, а не шаблон SQL LIKE.
      parameters:
        - $ref: '#/components/parameters/DPoPProof'
        - name: search
          in: query
          description: Подстрока email, имени или фамилии; максимум 255 символов до обработки.
          schema:
            type: string
            maxLength: 255
          example: ada
        - name: enabled
          in: query
          description: Фильтр активности; отсутствие означает оба состояния.
          schema:
            type: boolean
          example: true
        - name: page
          in: query
          description: Номер страницы, начиная с нуля.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Размер страницы.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Страница локальных профилей; items может быть пустым.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageResponse'
              example:
                items: []
                page: 0
                size: 20
                totalElements: 0
                totalPages: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Unexpected'
  /api/v1/admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/DPoPProof'
    get:
      tags: [Administration]
      operationId: getUserProfileById
      summary: Получить профиль по ID
      description: |
        Возвращает в том числе отключённый профиль. Если локальной записи нет,
        пытается синхронизировать её из Keycloak. Отсутствующая или локально удалённая
        запись возвращает 404; удалённая запись этим чтением не восстанавливается.
      responses:
        '200':
          $ref: '#/components/responses/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Unexpected'
  /api/v1/admin/users/{id}/status:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/DPoPProof'
    patch:
      tags: [Administration]
      operationId: setUserEnabled
      summary: Включить или заблокировать пользователя
      description: |
        Изменяет enabled в Keycloak и синхронизирует локальный профиль.
        При enabled=false дополнительно отзывает пользовательские сессии в Keycloak.
        После подтверждения Keycloak сохраняет enabled локально до полной синхронизации профиля.
        Блокировка не изменяет опросы, голоса, фото или персональные данные. Разблокировка
        не снимает отдельную модерационную блокировку опросов.
        Время отзыва сессий сохраняется в базе: после разблокировки нужен новый вход,
        токены с iat не позднее этого времени остаются недействительными.
        Администратор не может заблокировать самого себя (403).
        Сервис проверяет собственный профиль администратора и существование целевого.
        Удалённая или отсутствующая целевая запись возвращает 404.
        Действия в Keycloak, синхронизация и отзыв сессий не атомарны; при ошибке
        синхронизации отключения сервис всё равно пытается отозвать сессии.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusRequest'
            example:
              enabled: false
      responses:
        '200':
          $ref: '#/components/responses/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Unexpected'
components:
  securitySchemes:
    internalAuth:
      type: apiKey
      in: header
      name: X-Internal-Auth
      description: Общий серверный секрет шлюза. Никогда не передавать в браузер.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authorization Bearer с access token без cnf. Выпуск токена выполняется вне User Service.
    dpopAuth:
      type: http
      scheme: DPoP
      description: |
        Authorization DPoP с JWT access token, связанным с ключом через cnf.jkt.
        Обязателен отдельный заголовок DPoP с новым proof JWT для конкретного запроса.
        Поле security задаёт альтернативу Bearer, а не требование двух Authorization.
  parameters:
    DPoPProof:
      name: DPoP
      in: header
      required: false
      description: |
        Условно обязательный proof JWT при Authorization DPoP. required=false отражает
        возможность Bearer-аутентификации без этого заголовка. Не переиспользовать
        proof между запросами; генерировать его ключом, к которому привязан access token.
      schema:
        type: string
        minLength: 1
      x-required-with-security-scheme: dpopAuth
    UserId:
      name: id
      in: path
      required: true
      description: UUID пользователя в Keycloak и локальной проекции.
      schema:
        type: string
        format: uuid
      example: 7bbfa029-23b1-4dba-9850-e944e2a65a74
  schemas:
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '\S'
          description: Обязательно; не пустое и не состоящее только из пробелов (@NotBlank).
        lastName:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '\S'
          description: Обязательно; не пустое и не состоящее только из пробелов (@NotBlank).
    UserStatusRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: true включает пользователя, false блокирует и отзывает сессии.
    UserRole:
      type: string
      enum: [user, admin]
      description: Роль из локальной проекции; только строчные значения.
    UserHeaderResponse:
      type: object
      additionalProperties: false
      required: [firstName, lastName]
      properties:
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
    UserResponse:
      type: object
      required: [id, email, firstName, lastName, emailVerified, enabled, roles, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: [string, 'null']
          readOnly: true
          description: Email из Keycloak; в проекции может отсутствовать. Изменяется исключительно через Keycloak.
        firstName:
          type: [string, 'null']
          description: Имя из Keycloak; в проекции может отсутствовать.
        lastName:
          type: [string, 'null']
          description: Фамилия из Keycloak; в проекции может отсутствовать.
        emailVerified:
          type: boolean
        enabled:
          type: boolean
        roles:
          type: array
          uniqueItems: true
          description: Множество ролей; порядок не гарантируется, может быть пустым.
          items:
            $ref: '#/components/schemas/UserRole'
        createdAt:
          type: [string, 'null']
          format: date-time
          description: Время создания в источнике Keycloak, если источник его передал.
        updatedAt:
          type: string
          format: date-time
          description: Время последнего изменения локальной проекции, а не JWT и не время каждого чтения.
      example:
        id: 7bbfa029-23b1-4dba-9850-e944e2a65a74
        email: ada@example.test
        firstName: Ada
        lastName: Lovelace
        emailVerified: true
        enabled: true
        roles: [user]
        createdAt: '2026-01-01T00:00:00Z'
        updatedAt: '2026-01-02T00:00:00Z'
    UserPageResponse:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0
    ProblemDetail:
      type: object
      description: |
        Стандартный Spring ProblemDetail. errors — необязательное расширение для ошибок
        валидации; клиент должен уметь обрабатывать ответ без него. Текст сообщений не
        является машинным кодом ошибки. instance может отсутствовать, в частности в фильтрах.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
          example: The request is invalid or unsupported.
        instance:
          type: string
          format: uri-reference
          example: /api/v1/users/me
        code:
          type: string
          description: Необязательный код ошибки проверки изображения или удаления аккаунта.
          enum: [image.invalid, image.too-large, image.dimensions-exceeded, image.unsupported-format, account.unfinished-polls]
        errors:
          type: object
          additionalProperties:
            type: string
          description: Необязательная карта «имя поля → сообщение»; не содержит отклонённых значений.
  responses:
    User:
      description: Актуальная для выполненной операции локальная проекция пользователя.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserResponse'
    BadRequest:
      description: Неверные параметры, UUID, JSON, отсутствующие обязательные поля или неизвестные JSON-свойства.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: The request is invalid or unsupported.
    Unauthorized:
      description: |
        Аутентификация отсутствует или недействительна, JWT/proof отклонён либо связанный
        токен передан как Bearer. Entry point добавляет WWW-Authenticate: DPoP, Bearer.
        При отклонении Bearer downgrade в AccountAccessFilter этот заголовок не добавляется.
      headers:
        WWW-Authenticate:
          description: Challenge entry point; может отсутствовать при отказе фильтра AccountAccessFilter.
          schema:
            type: string
          example: DPoP, Bearer
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: Authentication is required.
    Forbidden:
      description: |
        Недостаточная роль, заблокированный/удалённый локальный вызывающий, отсутствие
        локальной роли admin для admin API либо запрещённое действие (самоблокировка).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            security:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                detail: Access is denied.
            profile:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                detail: This profile operation is not permitted.
    NotFound:
      description: Пользователь не найден, локально удалён либо исчез в Keycloak во время операции.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: User profile was not found.
    Conflict:
      description: Keycloak вернул конфликт записи (409), например email уже занят.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: The profile update conflicts with an existing account.
    UnsupportedMediaType:
      description: Неподдерживаемый тип содержимого тела запроса.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Unsupported Media Type
            status: 415
            detail: The request is invalid or unsupported.
    Unavailable:
      description: |
        Ошибка доступа к Keycloak для операций синхронизации/изменения либо недоступность
        локального хранилища при проверке статуса вызывающего в security filter.
        Некоторые предшествующие внешние действия могли уже завершиться.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            identity:
              value:
                type: about:blank
                title: Service Unavailable
                status: 503
                detail: The identity service is temporarily unavailable.
            security:
              value:
                type: about:blank
                title: Service Unavailable
                status: 503
                detail: The service is temporarily unavailable.
    Unexpected:
      description: |
        Прочие ошибки. Неожиданная ошибка приложения возвращает 500 со скрытыми
        внутренними деталями; стандартные ошибки HTTP также используют ProblemDetail.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            detail: The request could not be completed.
